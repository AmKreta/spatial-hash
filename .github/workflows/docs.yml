name: Deploy documentation
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'source/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - run: cp docs/dist/spatialhash-pages/browser/index.html docs/dist/spatialhash-pages/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist/spatialhash-pages/browser
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
